services:
  # 1. Spring Boot 3 Backend API (Docker Web Service)
  - type: web
    name: personalize-or-perish
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        value: jdbc:postgresql://aws-1-eu-west-3.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DATABASE_USERNAME
        value: postgres.jqyndhcemhfrsaqjoine
      - key: DATABASE_PASSWORD
        value: X2qouCicVYWb1DL3
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CHROMA_URL
        value: http://localhost:8000

  # 2. Angular 18 Frontend Client (Static Site)
  - type: web
    name: personalize-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
