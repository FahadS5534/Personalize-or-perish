spring:
  application:
    name: personalize-or-perish
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/personalizedb}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true

gemini:
  api-key: ${GEMINI_API_KEY:}

chroma:
  url: ${CHROMA_URL:http://localhost:8000}

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyWithAtLeast256BitsOfLengthForSecureSigningOfTokens123456}
  expiration: ${JWT_EXPIRATION:86400000}
