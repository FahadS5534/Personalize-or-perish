<div class="auth-container">
  <div class="glass-panel auth-card">
    <div class="auth-header">
      <div class="brand-logo">
        <span class="logo-text">Personalize <span class="logo-highlight">Or Perish</span></span>
      </div>
      <p class="auth-subtitle">Register Academic Account</p>
    </div>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          [(ngModel)]="name" 
          required 
          placeholder="John Doe"
        >
      </div>

      <div class="form-group">
        <label for="email">Institutional Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          required 
          placeholder="name@university.edu"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          required
          placeholder="At least 6 characters"
        >
      </div>

      <div class="form-group">
        <label for="role">Account Type / Role</label>
        <select id="role" name="role" [(ngModel)]="role" required>
          <option value="STUDENT">Student</option>
          <option value="FACILITATOR">Facilitator / Educator</option>
        </select>
      </div>

      <div *ngIf="successMessage" class="success-banner">
        <span class="success-icon">✓</span>
        <span class="success-text">{{ successMessage }}</span>
      </div>

      <div *ngIf="errorMessage" class="error-banner">
        <span class="error-icon">⚠</span>
        <span class="error-text">{{ errorMessage }}</span>
      </div>

      <button type="submit" [disabled]="registerForm.invalid || isLoading" class="btn-primary auth-submit">
        <span *ngIf="!isLoading">Create Account</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/auth/login" class="login-link">Sign In</a></p>
    </div>
  </div>
</div>
